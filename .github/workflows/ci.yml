name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, against the newest claimset (which is not pinned), so that a claimset change the portal cannot work
  # with shows up the same day.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m unittest discover -s classifier/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t portal .
      - name: Validate the Caddyfile
        run: >-
          docker run --rm -e PORTAL_DOMAIN=example.org -v "$PWD/deploy:/etc/caddy:ro" caddy:2
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check the server scripts
        run: shellcheck deploy/*.sh
      - name: Validate compose.yaml
        run: POSTGRES_PASSWORD=x docker compose config --quiet
