# The whole portal on one machine: the app, PostgreSQL with pgvector, the classifier, and Caddy (HTTPS and
# static files).
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#
# With PORTAL_DOMAIN=localhost, Caddy serves https://localhost with its own local certificate.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portal
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: the database is reachable only from the app, on the compose network.

  classifier:
    build:
      context: ./classifier
      secrets: [openalex_api_key]
    restart: unless-stopped
    # No published port: reachable only from the app.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      classifier:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      PORTAL_BASE_URL: https://${PORTAL_DOMAIN:-localhost}
      PORTAL_PUBLISHED_DIR: /srv/published
      PORTAL_ENV: ${PORTAL_ENV:-development}
      PORTAL_REGISTRY_DIR: /srv/registry
      PORTAL_SUBMISSIONS_DIR: /srv/submissions
      PORTAL_CLASSIFIER_URL: http://classifier:8001
      PORTAL_GIT_NAME: ${PORTAL_GIT_NAME:-EntryLib}
      PORTAL_GIT_EMAIL: ${PORTAL_GIT_EMAIL:-registry@entrylib.org}
      ORCID_BASE: ${ORCID_BASE:-https://sandbox.orcid.org}
      PORTAL_REGISTRY_MODE: ${PORTAL_REGISTRY_MODE:-local}
      GITHUB_REGISTRY: ${GITHUB_REGISTRY:-entrylib/registry}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
    volumes:
      - published:/srv/published
      - registry:/srv/registry
      - submissions:/srv/submissions
      - claimset:/home/portal/.local          # the claimset updated at each start (deploy/start.sh)
    secrets:
      - github_app_key

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-localhost}
    volumes:
      # The folder, not the file: `git pull` replaces the Caddyfile with a new file, which a file mount would not
      # see; launch.sh then reloads Caddy.
      - ./deploy:/etc/caddy:ro
      - published:/srv/published:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  github_app_key:
    file: ${GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}   # the GitHub App private key (github mode); never committed
  openalex_api_key:
    environment: OPENALEX_API_KEY      # set in .env; used only when the classifier image is built

volumes:
  db:
  published:
  registry:
  submissions:
  claimset:
  caddy_data:
  caddy_config:
