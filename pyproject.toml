[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
description = "EntryLib: the portal that publishes claimsets, research papers written for LLM readers."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [{name = "Claimset contributors"}]
dependencies = [
  # The claimset package is the single source of the format's rules: the portal calls it, never reimplements it.
  # From PyPI, not pinned: the portal works with whatever claimset it is given, at least portal.MIN_CLAIMSET. On the
  # server claimset is updated on its own, without rebuilding the portal (design §10).
  "claimset>=0.41.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.3.8",
  # GitHub App authentication (a JWT signed with the App's RSA key) for publishing through registry pull requests.
  "pyjwt[crypto]>=2.15.1",
  # The MCP server at /mcp (design §7.3): the official MCP Python SDK.
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28.1", "ruff>=0.6"]
# EntryLib's scoring rubric (design §7.6), from GitHub: without it the pages show "–" for scores.
scores = ["entrylib-rubric @ git+https://github.com/entrylib/rubric"]

[project.scripts]
portal = "portal.cli:main"

[project.urls]
Homepage = "https://github.com/entrylib/portal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portal = ["migrations/*.sql", "data/*.json", "static/*", "static/pages/*", "static/fonts/*", "static/img/*", "static/icons/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
